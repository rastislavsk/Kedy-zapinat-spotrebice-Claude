name: Fetch PV production data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-pv
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch FusionSolar kiosk data
        env:
          KIOSK_URL: https://uni004eu5.fusionsolar.huawei.com/rest/pvms/web/kiosk/v1/station-kiosk-file?kk=fNpkjQuEAOvn4Cn8hdu9k2GvPD9oPMuq
        run: node scripts/fetch-pv.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pv.json
          git diff --cached --quiet || git commit -m "chore: update PV production data"
          git push
