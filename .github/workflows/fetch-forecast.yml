name: Compute solar forecast

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-forecast
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute solar forecast
        run: node scripts/forecast.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update solar forecast"
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin
            git rebase "origin/$(git rev-parse --abbrev-ref HEAD)"
            sleep $((i * 3))
          done
          git push
